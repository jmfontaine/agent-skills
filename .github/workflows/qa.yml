name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: .pre-commit-config.yaml

      # Runs the hooks pinned in .pre-commit-config.yaml, which Dependabot keeps updated
      - name: Run pre-commit hooks
        run: uvx prek run --all-files --show-diff-on-failure

  # The one status check `main` requires. It needs every job above, so adding,
  # renaming or dropping a job never touches the ruleset. Keep its `needs` in step
  # with the jobs.
  ci-passed:
    name: CI passed
    needs: [lint]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
