repos:
  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 3429bee0c8870bff7874f898c6e8659d1ffe9645  # frozen: v0.2.79
    hooks:
      - id: rumdl-fmt
      - id: rumdl-check

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: f6467e1f1ebecf5020560405c7b26e01786a43c8  # frozen: v10.4.0
    hooks:
      - id: cspell

  # Workflow terms: the glossary in docs/workflow.md lists what replaced each one
  # cspell:ignore ning
  - repo: local
    hooks:
      - id: banned-terms
        name: banned terms
        language: pygrep
        entry: '(?i)\b(slice[ -]briefs?|slice[ -]reviews?|slice[ -]issues?|technical[ -]foundations?|spec[ -]checks?|pre-commit[ -]reviews?|intake[ -]issues?|user[ -]review|milestone[ -]plan(s|ning)?|pilots?|epics?)\b|(?<!architecture )\bdecision[ -]records?\b'
        files: ^skills/
