[global]
line-length = 88

[MD013]
reflow = true

# CLAUDE.md only imports AGENTS.md and has no heading. Issue and pull request templates
# are bodies; GitHub holds their titles separately. The parallel-issues prompt is sent
# to an agent as is.
[per-file-ignores]
".github/pull_request_template.md" = ["MD041"]
"CLAUDE.md" = ["MD041"]
"skills/github-workflow/assets/issue-template.md" = ["MD041"]
"skills/github-workflow/assets/pull-request-template.md" = ["MD041"]
"skills/parallel-issues/assets/prompt.md" = ["MD041"]
