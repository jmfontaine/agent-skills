[global]
line-length = 88
# Worktrees keep agent scratch files under .git/worktrees/; never lint or reformat them.
exclude = [".git"]

[MD013]
reflow = true

# Issue and pull request templates are bodies; GitHub holds their titles separately.
# The parallel-issues prompt is sent to an agent as is.
[per-file-ignores]
".github/pull_request_template.md" = ["MD041"]
"skills/github-workflow/assets/issue-template.md" = ["MD041"]
"skills/github-workflow/assets/pull-request-template.md" = ["MD041"]
"skills/parallel-issues/assets/prompt.md" = ["MD041"]
